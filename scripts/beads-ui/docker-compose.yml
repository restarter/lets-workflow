# beads-ui web dashboard
# Connects to Dolt via shared dolt-net Docker network
#
# Prerequisites:
#   - dolt-net Docker network exists (created by Dolt setup or: docker network create dolt-net)
#   - .env file with credentials (created by setup-remote.sh)
#
# Usage:
#   docker compose up -d --build

services:
  beads-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BEADS_UI_VERSION: ${BEADS_UI_VERSION:-0.11.1}
    container_name: beads-ui-${DATABASE:-default}
    restart: unless-stopped
    ports:
      - "${BEADS_UI_PORT:-9080}:${BEADS_UI_PORT:-9080}"
    volumes:
      - ./data/.beads:/app/.beads
    environment:
      - PORT=${BEADS_UI_PORT:-9080}
      - HOST=0.0.0.0
      - BD_BIN=/usr/local/bin/bd
      - BEADS_DOLT_SERVER_HOST=${DOLT_HOST:-dolt}
      - BEADS_DOLT_SERVER_PORT=${DOLT_PORT:-3306}
      - BEADS_DOLT_SERVER_USER=${SQL_USER}
      - BEADS_DOLT_PASSWORD=${SQL_PASSWORD}
    networks:
      - dolt-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M

networks:
  dolt-net:
    external: true