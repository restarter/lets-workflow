name: Verify Versions

# Source-tree version coherence guard.
# Runs on every PR to main + every tag push + push to main (defensive).
# Cheap (~10-15s): bash + jq + awk on ubuntu-latest, no Go setup, no build.
#
# Security: this workflow does NOT use any untrusted user input (issue titles,
# PR bodies, commit messages) in run: commands. github.ref is a controlled
# value that GitHub validates against allowed branch/tag patterns.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # defensive: catch drift if anyone bypasses PR review
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify version coherence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need full history for git describe (--against-tag check)

      - name: Verify source-tree versions
        run: bash scripts/release/verify-versions.sh

      - name: Verify tag matches source-tree (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/release/verify-versions.sh --against-tag
